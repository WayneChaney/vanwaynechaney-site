<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book a Call — Vanwayne Chaney Jr.</title>
<meta name="description" content="Call Vanwayne Chaney Jr.'s AI at 216-616-1364. Ask it about him, or call in like a customer and let it book you.">

<meta property="og:title" content="Book a Call — Vanwayne Chaney Jr.">
<meta property="og:description" content="216-616-1364. Ask it about me, or call in like a customer and let it book you.">
<meta property="og:image" content="https://vanwaynechaney.com/og-call.jpg">
<meta property="og:url" content="https://vanwaynechaney.com/call">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Mono:wght@400&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0a0c; --card:#121216; --gold:#c9a84c;
    --text:#f4f2ee; --muted:#8d8a84; --border:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:1.5rem; text-align:center; line-height:1.5;
  }
  .wrap{max-width:420px;width:100%}
  .label{
    font-family:'DM Mono',monospace; font-size:.68rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--gold); margin-bottom:1rem;
  }
  h1{
    font-family:'Cormorant Garamond',serif; font-weight:600;
    font-size:clamp(2rem,9vw,2.8rem); line-height:1.1; margin-bottom:.75rem;
  }
  p.sub{color:var(--muted); font-size:.95rem; margin-bottom:2rem}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:.5rem;
    width:100%; min-height:5.5rem; padding:1.25rem 1.5rem;
    background:var(--gold); color:#0a0a0c; text-decoration:none;
    font-weight:600; font-size:1.45rem; border-radius:16px;
    border:0; cursor:pointer; font-family:inherit;
    box-shadow:0 8px 30px rgba(201,168,76,.22);
  }
  .btn:active{transform:translateY(1px)}
  .num{
    display:block; margin-top:1.25rem; font-family:'DM Mono',monospace;
    font-size:1.35rem; color:var(--text); text-decoration:none; letter-spacing:.02em;
  }
  .note{margin-top:1.75rem; font-size:.8rem; color:var(--muted); opacity:.8}
  .back{
    display:inline-block; margin-top:2.5rem; font-size:.8rem;
    color:var(--muted); text-decoration:none; border-bottom:1px solid var(--border);
    padding-bottom:2px;
  }
  @media (prefers-reduced-motion:no-preference){
    .wrap{animation:in .4s ease-out both}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="label">VC2 AI · Cleveland</div>
    <h1>Let&rsquo;s talk</h1>
    <p class="sub" id="sub">Thirty minutes, free. Tell me what job is eating your week and I&rsquo;ll tell you what I&rsquo;d automate first.</p>

    <!-- This page was "Call My AI" and pointed at the demo line. The AI does not
         reliably answer, so the page was promising something it could not keep.
         It is a printed short link, so the page stays and the action changed. -->
    <a href="https://cal.com/vanwaynechaney/vc2-ai-service-call" class="btn" id="callBtn" target="_blank" rel="noopener noreferrer">Pick a time</a>
    <a href="/book.html" class="num">See open times &rarr;</a>

    <p class="note" id="note"></p>
    <a href="/" class="back">See what else I build</a>
  </main>

<script>
/* --------------------------------------------------------------------------
   /call — the short link. Say it out loud, put it on a card.

   NO AUTO-DIAL. This was tried and it is strictly worse.

   iOS answers a programmatic tel: navigation with a security warning reading
   "This website has been blocked from automatically starting a call," with
   Ignore / Allow Call. So auto-dialing costs an EXTRA tap AND brands the site
   as something that tried to do it behind your back. Verified on a real
   iPhone 2026-08-09. Deep Research #306 called this correctly.

   A plain tap on the button below gets the ordinary "Call (216) 616-1364?"
   confirm instead — one tap, no warning, no suspicion. That confirm itself is
   an iOS/Android anti-toll-fraud guarantee and cannot be removed by any site.
   One tap is the floor. Do not try to beat it again.

   DESKTOP -> shows the number to read off, since desktops cannot place calls.
   -------------------------------------------------------------------------- */
(function () {
  var isTouch = window.matchMedia &&
                window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  var note = document.getElementById('note');

  if (!isTouch) {
    document.getElementById('sub').textContent =
      'Grab your phone and dial the number below — it answers on the first ring.';
    document.getElementById('callBtn').style.display = 'none';
    if (note) note.textContent = 'You are on a computer, so it cannot dial for you.';
    return;
  }

  if (note) note.textContent = 'One tap. It answers on the first ring.';

  /* When the call ends and they come back to this tab, move them onto the
     site rather than leaving them on a page whose only job is already done.
     Only fires if they actually left for the dialer — someone who never
     called is reading, and gets left alone. */
  var leftForDialer = false;

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { leftForDialer = true; return; }
    if (!leftForDialer) return;
    if (note) note.textContent = 'Taking you to the site…';
    setTimeout(function () { window.location.replace('/'); }, 1200);
  });
})();
</script>

  <script>
  /* One tap to the calendar on a phone.
     Wayne, 2026-09-25: he tapped "See open times", landed on book.html, and the
     first thing there was another button saying "See open times". book.html
     exists because Cal's inline embed only renders right on desktop - on a
     phone it was always going to hand off to Cal anyway, so it hands off now
     instead of after an extra page and an extra tap.
     Desktop is untouched. JS off falls back to book.html, which still works. */
  (function () {
    if (!window.matchMedia || !window.matchMedia('(max-width: 767px)').matches) return;
    var cal = 'https://cal.com/vanwaynechaney/vc2-ai-service-call';
    var links = document.querySelectorAll('a[href$="book.html"]');
    for (var i = 0; i < links.length; i++) {
      links[i].setAttribute('href', cal);
      links[i].removeAttribute('data-page-transition');
      links[i].setAttribute('target', '_blank');
      links[i].setAttribute('rel', 'noopener noreferrer');
    }
  })();
  </script>
</body>
</html>
